name: ETL Relatório QRFY (incremental)

on:
  schedule:
    # 09:00 UTC = 06:00 BRT, diário.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Data inicial manual (YYYY-MM-DD) — ignora watermark"
        type: string
        default: ""

concurrency:
  group: etl-qrfy-relatorio
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Escrever credencial do BigQuery
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Rodar ETL
        env:
          QRFY_API_KEY: ${{ secrets.QRFY_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp_sa.json
        run: |
          if [ -n "${{ inputs.from_date }}" ]; then
            python etl/qrfy_relatorio.py --from-date "${{ inputs.from_date }}"
          else
            python etl/qrfy_relatorio.py
          fi
